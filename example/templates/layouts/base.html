{{define "base.html"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Coyote</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{if not .HideNav}}{{template "nav.html" .}}{{end}}
  <main>
    {{range .Flashes}}<div class="flash {{.Kind}}">{{.Message}}</div>{{end}}
    {{block "content" .}}{{end}}
  </main>
  <footer>Built with Coyote v{{.Version}}</footer>
</body>
</html>
{{end}}
