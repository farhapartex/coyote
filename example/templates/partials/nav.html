{{define "nav.html"}}
<header class="topbar">
  <a class="logo" href="/">coyote</a>
  <nav>
    <a href="{{url "home"}}" class="{{if eq .Path "/"}}active{{end}}">Home</a>
    <a href="{{url "notes"}}" class="{{if eq .Path "/notes"}}active{{end}}">Notes</a>
    <a href="{{url "about"}}" class="{{if eq .Path "/about"}}active{{end}}">About</a>
    {{if .User}}
      <a href="/me/">{{.User.Username}}</a>
      {{if .User.IsSuperadmin}}<a href="/admin/">Admin</a>{{end}}
    {{else}}
      <a href="/admin/login">Log in</a>
    {{end}}
  </nav>
</header>
{{end}}
