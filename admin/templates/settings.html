{{define "title"}}Settings{{end}}

{{define "content"}}
<div class="page-head">
  <h2>Effective settings</h2>
  <span class="muted" style="font-size:13px">Read only — edit settings.go and restart</span>
</div>

{{if .Debug}}
<div class="flash warning">Debug is enabled. Turn it off before deploying.</div>
{{end}}

{{range .Groups}}
<div class="card">
  <div class="card-head">{{.Name}}</div>
  <table>
    <tbody>
      {{range .Rows}}
      <tr><td style="width:34%">{{.Name}}</td><td class="mono">{{.Value}}</td></tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
{{end}}
