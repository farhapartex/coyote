{{define "title"}}Log in{{end}}

{{define "body"}}
<div class="login-wrap">
  <div class="logo">
    <img src="{{.Prefix}}/favicon.png" alt="">
    <div class="name">{{.SiteName}}</div>
    {{if .Tagline}}<div class="sub">{{.Tagline}}</div>{{end}}
  </div>

  {{range .Flashes}}<div class="flash {{.Kind}}">{{.Message}}</div>{{end}}
  {{if .Error}}<div class="flash error">{{.Error}}</div>{{end}}

  <div class="card">
    <div class="card-body">
      <form method="post" action="{{.Prefix}}/login" class="stack">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="next" value="{{.Next}}">
        <label>Username
          <input type="text" name="username" value="{{.Username}}" autocomplete="username" autofocus required>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit" style="width:100%">Log in</button>
      </form>
    </div>
  </div>
  <footer class="foot">Coyote v{{.Version}}</footer>
</div>
{{end}}
