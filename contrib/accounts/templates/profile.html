{{define "content"}}
<div class="card">
  <h1>Your profile</h1>
  {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
  <form method="post" action="{{.Prefix}}/profile">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="row">
      <label>First name
        <input type="text" name="first_name" value="{{.Form.FirstName}}">
      </label>
      <label>Last name
        <input type="text" name="last_name" value="{{.Form.LastName}}">
      </label>
    </div>
    <label>Email
      <input type="email" name="email" value="{{.Form.Email}}">
    </label>
    <p class="muted">Signed in as {{.Form.Username}}.</p>
    <button type="submit">Save profile</button>
  </form>

  {{if .AllowPasswordChange}}
  <h2>Change password</h2>
  {{if .PasswordError}}<div class="alert">{{.PasswordError}}</div>{{end}}
  <form method="post" action="{{.Prefix}}/password">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label>Current password
      <input type="password" name="current_password" autocomplete="current-password" required>
    </label>
    <label>New password
      <input type="password" name="new_password" autocomplete="new-password" required>
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" autocomplete="new-password" required>
    </label>
    <button type="submit">Change password</button>
  </form>
  {{end}}
</div>

<form method="post" action="{{.Prefix}}/logout" class="foot">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <button type="submit">Sign out</button>
</form>
{{end}}
